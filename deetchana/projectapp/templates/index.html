<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dribbble Clone</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<!-- Navbar -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand fw-bold" href="#">
            Dribbble 
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Designs</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Artists</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- Hero Section -->

<div class="container text-center py-5">

    <h1 class="display-4 fw-bold">
        Discover Creative Designers
    </h1>

    <p class="lead">
        Explore amazing UI and web inspirations.
    </p>

    <button class="btn btn-primary btn-lg">
        Explore
    </button>

</div>

<!-- Cards Section -->

<div class="container my-5">

    <div class="row g-4">

        <div class="col-md-4">

            <div class="card">

                <img src="https://picsum.photos/300/200?1" class="card-img-top">

                <div class="card-body">

                    <h5 class="card-title">
                        Mobile UI
                    </h5>

                    <p class="card-text">
                        Creative mobile interface designs.
                    </p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <img src="https://picsum.photos/300/200?2" class="card-img-top">

                <div class="card-body">

                    <h5 class="card-title">
                        Website Design
                    </h5>

                    <p class="card-text">
                        Modern responsive web layouts.
                    </p>

                </div>

            </div>

        </div>

        <div class="col-md-4">

            <div class="card">

                <img src="https://picsum.photos/300/200?3" class="card-img-top">

                <div class="card-body">

                    <h5 class="card-title">
                        Dashboard UI
                    </h5>

                    <p class="card-text">
                        Professional admin dashboards.
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

<!-- Footer -->

<footer class="bg-dark text-white text-center p-3">

    Created by Deetchana

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
